jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # 1. Configurar Node.js para poder compilar React/Vite
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 2. Instalar dependencias
      - name: Install dependencies
        run: npm install

      # 3. Construir el proyecto (genera la carpeta 'dist')
      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      # 4. Subir la carpeta 'dist' en lugar de la raíz
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist' 

      - uses: actions/deploy-pages@v5
